[package]
name = "xbsol"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.45"
regex = "1.13.1"
thiserror = "2.0.21"
log = "0.4.34"
env_logger = "0.11.11"
