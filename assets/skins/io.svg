<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Schwefelgelbe Basis von Io mit intensiver radialer Tiefenwirkung -->
    <radialGradient id="ioGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fcd14d" />
      <stop offset="50%" stop-color="#dca122" />
      <stop offset="85%" stop-color="#915b0b" />
      <stop offset="100%" stop-color="#422402" />
    </radialGradient>

    <!-- Dunkle Lava-Seen und vulkanische Kraterböden (Paterae) -->
    <radialGradient id="lavaDark" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3d2216" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1f0f08" stop-opacity="0.95" />
    </radialGradient>

    <!-- Frische, rötlich-braune Schwefel- und Magma-Ausbrüche -->
    <radialGradient id="magmaRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cc3718" />
      <stop offset="65%" stop-color="#8a1f0a" />
      <stop offset="100%" stop-color="#420b02" stop-opacity="0" />
    </radialGradient>

    <!-- Globale 3D-Schattierung (Tag-Nacht-Grenze) -->
    <radialGradient id="ioShadow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.96" />
    </radialGradient>
  </defs>

  <!-- 1. Die Io-Kugel (Basis der Schwefelebene) -->
  <circle cx="256" cy="256" r="160" fill="url(#ioGrad)" />

  <!-- 2. Große, weißlich-grüne Frost-Ebenen (Schwefeldioxid-Schnee) -->
  <g fill="#e2ebcd" opacity="0.45">
    <path d="M 150 140 q 30 10 45 -20 q 40 30 5 50 q -30 20 -50 -30 z" />
    <path d="M 310 260 q 25 -30 50 -10 q 15 40 -35 30 q -20 -5 -15 -20 z" />
    <path d="M 210 330 q 40 -15 35 25 q -30 25 -45 -10 q -5 -15 10 -15 z" />
    <path d="M 260 160 q 30 -30 50 10 q -20 30 -40 10 q -15 -5 -10 -20 z" />
  </g>

  <!-- 3. Rötlich-orange Ringe um die großen Ausbruchszentren (z.B. Pele & Twashtar) -->
  <!-- Diese entstehen, wenn vulkanische Riesen-Plumes Material hunderte Kilometer weit ausstoßen -->
  <g fill="url(#magmaRed)">
    <!-- Große Pele-Region im Süden -->
    <ellipse cx="240" cy="300" rx="35" ry="22" opacity="0.8" />
    <!-- Twashtar-Region im Norden -->
    <ellipse cx="270" cy="140" rx="25" ry="15" opacity="0.75" />
    <!-- Weitere kleinere heiße Zonen -->
    <circle cx="160" cy="210" r="18" opacity="0.7" />
    <circle cx="340" cy="200" r="22" opacity="0.65" />
  </g>

  <!-- 4. Die tatsächlichen vulkanischen Schlote und Lava-Seen (Paterae) -->
  <!-- Komplett unregelmäßige, dunkle Flecken im Zentrum der roten Ringe -->
  <g fill="url(#lavaDark)">
    <!-- Pele-Zentral-See -->
    <path d="M 235 295 q 10 -8 20 -2 q 5 12 -8 12 q -15 2 -12 -10 z" />
    <!-- Twashtar-Schlot -->
    <path d="M 268 136 q 12 -4 14 6 q -6 8 -12 2 q -5 -4 -2 -8 z" />
    
    <!-- Loki Patera (Der größte kochende Lava-See auf Io, Mitte Links) -->
    <path d="M 165 195 q 15 -10 25 5 q 5 20 -15 15 q -20 -5 -10 -20 z" />
    
    <!-- Weitere verstreute, aktive Calderen -->
    <circle cx="335" cy="195" r="5" />
    <circle cx="350" cy="210" r="4" />
    <circle cx="210" cy="170" r="6" />
    <circle cx="190" cy="250" r="4.5" />
    <circle cx="290" cy="260" r="5" />
    <circle cx="280" cy="340" r="3.5" />
    <circle cx="150" cy="270" r="4" />
  </g>

  <!-- 5. Glühende Magma-Punkte im Zentrum der Vulkane (Hotspots) -->
  <g fill="#ff5722" opacity="0.9">
    <circle cx="238" cy="297" r="1.5" />
    <circle cx="270" cy="138" r="1.2" />
    <circle cx="175" cy="202" r="2" />
    <circle cx="335" cy="195" r="1" />
  </g>

  <!-- 6. Globale 3D-Schattierung (Liegt als transparente Ebene über den Schwefel- und Lavastrukturen) -->
  <circle cx="256" cy="256" r="160" fill="url(#ioShadow)" />

  <!-- 7. Innerer Lichtkranz (Hebt den intensiven, plastischen Look der Planetenkugel hervor) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fff5cc" stroke-width="4" opacity="0.2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#dca122" stroke-width="1.5" opacity="0.3" />
</svg>
