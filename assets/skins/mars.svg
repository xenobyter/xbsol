<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Mars-Oberflächenfarbe mit radialer Tiefenwirkung -->
    <radialGradient id="marsGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e27f53" />
      <stop offset="45%" stop-color="#b84c21" />
      <stop offset="85%" stop-color="#7a2607" />
      <stop offset="100%" stop-color="#421000" />
    </radialGradient>

    <!-- Dunklere Mars-Strukturen (Albedo-Features) -->
    <radialGradient id="darkFeaturesGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#70341b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#421a0a" stop-opacity="0.9" />
    </radialGradient>

    <!-- Helle, rötliche Staubstürme/Wolken -->
    <radialGradient id="dustGrad" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0b49e" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#e29f84" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Globale 3D-Schattierung (Tag-Nacht-Grenze analog zur Erde) -->
    <radialGradient id="marsShadow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </radialGradient>
  </defs>

  <!-- 1. Hauchdünne Mars-Atmosphäre (Zartes orange-rotes Leuchten im Hintergrund) -->
  <circle cx="256" cy="256" r="162" fill="#e27f53" opacity="0.15" />

  <!-- 2. Die Mars-Kugel (Basis) -->
  <circle cx="256" cy="256" r="160" fill="url(#marsGrad)" />

  <!-- 3. Markante Oberflächenstrukturen (z.B. Syrtis Major & dunkle Ebenen) -->
  <g fill="url(#darkFeaturesGrad)">
    <!-- Große dunkle Struktur Mitte/Unten -->
    <path d="M 160 280 q 40 20 80 10 q 50 -15 70 -50 q 25 -40 40 -10 q 15 30 -10 50 q -30 25 -60 35 q -45 15 -75 -5 q -30 -20 -45 -30 z" />
    <!-- Nördliche dunkle Strukturen -->
    <path d="M 180 150 q 30 -15 60 -5 q 40 10 50 -20 q 10 -25 -20 -15 q -30 10 -50 0 q -20 -10 -40 40 z" />
    <!-- Valles Marineris (Andeutung des riesigen Grabenbruchs in der Mitte) -->
    <path d="M 130 220 q 60 5 120 15 q 40 5 60 -5 q 15 -8 5 -12 q -30 5 -70 -5 q -60 -10 -115 7 z" />
  </g>

  <!-- 4. Die weiße Polarkappe (Norden/Oben - leicht geneigt) -->
  <ellipse cx="245" cy="102" rx="25" ry="7" fill="#ffffff" opacity="0.9" />
  <ellipse cx="245" cy="102" rx="30" ry="10" fill="#fff3ed" opacity="0.4" />

  <!-- 5. Feine, helle Staub- und CO2-Wolkenbänder -->
  <g fill="url(#dustGrad)">
    <path d="M 120 180 c 40 -20, 90 -10, 140 5 c 40 10, 70 -15, 110 0 c 15 5, -20 15, -50 5 c -40 -10, -70 10, -110 -5 c -30 -10, -60 10, -90 -5 z" />
    <path d="M 140 320 c 30 -5, 70 -15, 110 -5 c 35 10, 65 -5, 90 10 c -25 10, -55 0, -85 -10 c -30 -10, -60 10, -85 5 c -15 0, -20 -5, -30 0 z" />
  </g>

  <!-- 6. Globale 3D-Schattierung (Liegt als transparente Ebene über den Details) -->
  <circle cx="256" cy="256" r="160" fill="url(#marsShadow)" />

  <!-- 7. Innerer Lichtkranz (Gibt der Kugel den finalen plastischen Look) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffb094" stroke-width="5" opacity="0.2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#e27f53" stroke-width="2" opacity="0.3" />
</svg>
