<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ganymeds dunkle, uralte Gesteins- und Eisbasis mit Tiefenwirkung -->
    <radialGradient id="ganymedGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#736960" />
      <stop offset="45%" stop-color="#544c44" />
      <stop offset="80%" stop-color="#332c27" />
      <stop offset="100%" stop-color="#171310" />
    </radialGradient>

    <!-- Hellere, jüngere Eisregionen für die Furchen-Systeme (Sulci) -->
    <radialGradient id="brightSulci" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c7bdac" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6e6356" stop-opacity="0.95" />
    </radialGradient>

    <!-- Globale 3D-Schattierung (Tag-Nacht-Grenze) -->
    <radialGradient id="ganymedShadow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.96" />
    </radialGradient>
  </defs>

  <!-- 1. Die Ganymed-Kugel (Basis der dunklen Regionen) -->
  <circle cx="256" cy="256" r="160" fill="url(#ganymedGrad)" />

  <!-- 2. Die helleren, tektonischen Furchenbänder (Sulci) -->
  <!-- Diese Pfade formen die dunklen Regionen wie "Galileo Regio" (oben rechts) im Negativraum aus -->
  <g fill="url(#brightSulci)">
    <!-- Breites, geschwungenes Band durch die Mitte -->
    <path d="M 110 210 c 40 -20, 90 30, 160 10 c 60 -15, 90 -70, 132 -60 c -10 30, -50 60, -110 50 c -70 -10, -110 30, -150 -10 c -15 -15, -25 -2, -32 10 z" />
    <!-- Südliches helles Bandsystem -->
    <path d="M 130 310 q 60 -40 130 -10 q 70 30 115 -30 q 5 25 -20 50 q -60 50 -130 5 q -50 -35 -95 -15 z" />
    <!-- Nördliches Bandsystem um die Polkappe -->
    <path d="M 160 120 q 50 30 110 -10 q 40 -25 70 -5 q -30 20 -70 10 q -50 30 -110 5 z" />
  </g>

  <!-- 3. Feine tektonische Rillen und Gräben innerhalb der hellen Bänder -->
  <g fill="none" stroke="#544c44" stroke-width="1.2" opacity="0.6" stroke-linecap="round">
    <path d="M 120 205 q 40 -15 80 5 M 125 215 q 35 -12 75 10 M 130 225 q 40 -10 70 15" />
    <path d="M 240 230 q 45 -5 85 -30 M 245 242 q 40 -3 80 -25 M 250 255 q 45 0 75 -20" />
    <path d="M 150 315 q 50 -30 100 -10 M 165 325 q 45 -25 90 -8" />
    <path d="M 280 310 q 50 25 85 -20 M 290 322 q 45 20 75 -15" />
  </g>

  <!-- 4. Strahlungs-Krater (Frische Einschläge, die helles Material ausgeworfen haben) -->
  <!-- Krater Osiris im Süden mit gut sichtbaren Eisspritzern (Ray Crater) -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="230" cy="350" r="3.5" />
    <!-- Strahlenkranz von Osiris -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.4">
      <path d="M 230 350 l -25 -15 M 230 350 l 20 20 M 230 350 l -15 25 M 230 350 l 25 -10 M 230 350 l -8 -25 M 230 350 l 5 -20 M 230 350 l 12 25 M 230 350 l -22 5" />
    </g>

    <!-- Ein weiterer markanter Strahlenkrater im Norden -->
    <circle cx="210" cy="150" r="2.5" />
    <g stroke="#ffffff" stroke-width="0.6" opacity="0.35">
      <path d="M 210 150 l -15 -10 M 210 150 l 15 12 M 210 150 l -10 15 M 210 150 l 15 -5 M 210 150 l -2 -18" />
    </g>

    <!-- Allgemeine kleinere Einschlagspunkte auf dem gesamten Mond -->
    <circle cx="140" cy="170" r="1.5" opacity="0.6" />
    <circle cx="340" cy="160" r="2" opacity="0.5" />
    <circle cx="310" cy="240" r="2" opacity="0.7" />
    <circle cx="280" cy="180" r="1.5" opacity="0.6" />
    <circle cx="170" cy="270" r="2" opacity="0.5" />
    <circle cx="360" cy="280" r="1.5" opacity="0.6" />
  </g>

  <!-- 5. Globale 3D-Schattierung (Liegt als transparente Ebene über allen Strukturen) -->
  <circle cx="256" cy="256" r="160" fill="url(#ganymedShadow)" />

  <!-- 6. Innerer Lichtkranz für die plastische Kugelform -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#e6e1da" stroke-width="4" opacity="0.15" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#736960" stroke-width="1.5" opacity="0.25" />
</svg>
