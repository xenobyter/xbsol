<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Grundfarbe des Jupiter (Beige/Marmorierung mit radialer Tiefenwirkung) -->
    <radialGradient id="jupiterGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e8caa4" />
      <stop offset="50%" stop-color="#cc9e6c" />
      <stop offset="85%" stop-color="#8f5d34" />
      <stop offset="100%" stop-color="#4a2c11" />
    </radialGradient>

    <!-- Farbverlauf für den Großen Roten Fleck -->
    <radialGradient id="redSpotGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#cc4125" />
      <stop offset="70%" stop-color="#992612" />
      <stop offset="100%" stop-color="#591105" />
    </radialGradient>

    <!-- Globale 3D-Schattierung (Tag-Nacht-Grenze analog zur Erde und zum Mars) -->
    <radialGradient id="jupiterShadow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </radialGradient>

    <clipPath id="jupiterClip">
      <circle cx="256" cy="256" r="160" />
    </clipPath>
  </defs>

  <!-- 1. Die Jupiter-Kugel (Basis) -->
  <circle cx="256" cy="256" r="160" fill="url(#jupiterGrad)" />

  <g clip-path="url(#jupiterClip)">
  <!-- 2. Die charakteristischen Gasbänder (Pfade exakt innerhalb des 160px Radius) -->
  <!-- Dunkelbraune/Rötliche Wolkenbänder -->
  <g fill="#9c633a" opacity="0.85">
    <!-- Nördliches breites Wolkenband -->
    <path d="M 125 170 c 40 -15, 90 -10, 131 -20 c 45 -11, 95 10, 131 20 c -30 15, -80 0, -131 12 c -45 10, -90 -3, -131 -12 z" />
    <!-- Südliches breites Wolkenband (Hauptband) -->
    <path d="M 100 270 c 50 -15, 100 -5, 156 -18 c 50 -12, 100 12, 156 18 c -35 15, -85 -5, -156 12 c -50 12, -100 -5, -156 -12 z" />
    <!-- Dünneres Band nahe dem Südpol -->
    <path d="M 140 371 c 35 -5, 75 -15, 116 -5 c 35 10, 70 -5, 116 5 c -25 10, -55 0, -116 -7 c -35 -7, -75 7, -116 -3 z" />
  </g>

  <!-- Hellere/Beige/Weiße Sturmbänder -->
  <g fill="#f5e1c9" opacity="0.6">
    <!-- Äquator-Zone (Mitte) -->
    <path d="M 96 220 c 50 -10, 100 5, 160 -10 c 50 -13, 100 10, 160 10 c -30 15, -80 -5, -160 8 c -50 10, -100 -5, -160 -8 z" />
    <!-- Dünnes nördliches Band -->
    <path d="M 152 125 c 30 -8, 65 -15, 104 -5 c 35 9, 65 -5, 104 5 c -25 8, -55 0, -104 -5 c -35 -5, -65 5, -104 -3 z" />
  </g>

  <!-- Wirbelstrukturen und kleine Ovale innerhalb der Bänder -->
  <g fill="#734222" opacity="0.7">
    <ellipse cx="200" cy="162" rx="14" ry="5" />
    <ellipse cx="320" cy="164" rx="18" ry="6" />
    <ellipse cx="160" cy="272" rx="12" ry="4" />
  </g>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="280" cy="215" r="5" />
    <circle cx="340" cy="216" r="4" />
    <circle cx="180" cy="340" r="6" />
    <circle cx="220" cy="342" r="4" />
  </g>

  <!-- 3. Der Große Rote Fleck (Unten rechts im südlichen Wolkenband) -->
  <ellipse cx="325" cy="285" rx="26" ry="15" fill="url(#redSpotGrad)" />
  <!-- Hellerer innerer Wirbelkern -->
  <ellipse cx="327" cy="285" rx="14" ry="7" fill="#e6613b" opacity="0.6" />
  <!-- Dunkle Verwirbelung direkt dahinter (Wakes) -->
  <path d="M 350 285 q 20 -5 30 5" fill="none" stroke="#591105" stroke-width="3" opacity="0.5" stroke-linecap="round" />

  <!-- 4. Globale 3D-Schattierung (Liegt als transparente Ebene über allen Wolkenstrukturen) -->
  <circle cx="256" cy="256" r="160" fill="url(#jupiterShadow)" />
  </g>

  <!-- 5. Innerer Lichtkranz (Gibt der Gaskugel plastische Tiefe am beleuchteten Rand) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fff1de" stroke-width="5" opacity="0.25" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#cc9e6c" stroke-width="2" opacity="0.3" />
</svg>
